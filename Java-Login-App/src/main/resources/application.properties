spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Override with SPRING_DATASOURCE_URL / USERNAME / PASSWORD when running from Harbor.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/UserDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
